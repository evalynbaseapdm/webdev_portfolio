<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Evalyn Basea</title>
</head>
<body>
    <main id="form">
        <img id="myImg" src="frog-profile.png" alt="Frog working on a laptop">
        <img id="codingImg" src="frog-coding.png" alt="Frog coding at a desk">
        <h1 id="name">Evalyn Basea</h1>
        <p class="course">BS Computer Science</p>

        <label for="nickname">Your nickname</label>
        <input id="nickname" type="text" placeholder="Enter your nickname">

        <label for="year">Your year</label>
        <select id="year">
            <option value="">Select year</option>
            <option value="1st year">1st year</option>
            <option value="2nd year">2nd year</option>
            <option value="3rd year">3rd year</option>
            <option value="4th year">4th year</option>
        </select>

        <div class="btns">
            <button id="btn1" type="button">Say hello</button>
            <button id="btn2" type="button">Double click</button>
            <button id="btn3" type="button">Press &amp; hold</button>
        </div>
        <p id="status" aria-live="polite">Try one of the buttons!</p>
    </main>

    <script src="script (1).js"></script>
</body>
</html>
