<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Loading Demo | Evalyn Basea</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        body.dark-mode {
            background: #222;
            color: white;
        }

        body.dark-mode .student-form {
            background: #503c45;
        }

        body.dark-mode table {
            background: #553f49;
            color: white;
        }

        body.dark-mode th {
            background: #684b59;
        }

        .mode-controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 68px;
        }

        button {
            padding: 10px;
            border: 1px solid black;
            background: #f4bfd0;
            color: black;
            font: inherit;
            cursor: pointer;
        }

        .student-form {
            width: min(440px, 100%);
            margin: 0 auto;
            padding: 30px;
            padding-bottom: 50px;
            border: 2px solid gray;
            background: #fff0f5;
        }

        .field label {
            display: block;
        }

        .field input {
            display: block;
            width: 100%;
            height: 39px;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 19px;
        }

        .course-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .course-field label {
            white-space: nowrap;
        }

        .course-field select {
            width: 150px;
            height: 38px;
            padding: 0 10px;
        }

        .submit-button {
            padding: 10px;
            white-space: nowrap;
        }

        .list-section {
            width: min(446px, 100%);
            margin: 28px auto 0;
        }

        .list-section h1 {
            margin: 0 0 2px;
            font-size: 32px;
            text-align: center;
        }

        .table-wrap {
            overflow-x: auto;
            border: 2px solid black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8dce5;
            color: black;
            text-align: center;
        }

        th,
        td {
            height: 42px;
            padding: 7px;
            border: 1px solid black;
        }

        th {
            background: #f3cad8;
        }

        @media (max-width: 480px) {
            .mode-controls {
                gap: 24px;
                margin-bottom: 52px;
            }

            .student-form {
                padding: 22px;
            }

            .form-actions {
                flex-wrap: wrap;
                gap: 16px;
            }

            .course-field {
                flex: 1 1 100%;
            }

            .course-field select {
                flex: 1;
            }

            table {
                min-width: 420px;
            }
        }
    </style>
</head>
<body>
    <div class="mode-controls" aria-label="Display mode">
        <button id="dark-mode" type="button" aria-pressed="false">Dark Mode</button>
        <button id="original-mode" type="button" aria-pressed="true">Original Mode</button>
    </div>

    <main>
        <form class="student-form" id="student-form">
            <div class="field">
                <label for="first-name">First Name:</label>
                <input id="first-name" name="firstName" type="text" required>
            </div>
            <div class="field">
                <label for="last-name">Last Name:</label>
                <input id="last-name" name="lastName" type="text" required>
            </div>
            <div class="field">
                <label for="student-number">Student Number:</label>
                <input id="student-number" name="studentNumber" type="text" required>
            </div>
            <div class="form-actions">
                <div class="course-field">
                    <label for="course">COURSE</label>
                    <select id="course" name="course">
                        <option value="BSCS">BSCS</option>
                        <option value="BSTM">BSTM</option>
                        <option value="BSHM">BSHM</option>
                        <option value="BSIT">BSIT</option>
                    </select>
                </div>
                <button class="submit-button" type="submit">Submit Form</button>
            </div>
        </form>

        <section class="list-section" aria-labelledby="list-title">
            <h1 id="list-title">Student List</h1>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Student Number</th>
                            <th scope="col">First Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Course</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        <tr><td>001</td><td>Evalyn</td><td>Basea</td><td>BSCS</td></tr>
                        <tr><td>002</td><td>Justine</td><td>Belen</td><td>BSCS</td></tr>
                        <tr><td>003</td><td>Jezreel</td><td>Delacruz</td><td>BSCS</td></tr>
                        <tr><td>004</td><td>Alliyah</td><td>Garcia</td><td>BSCS</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
